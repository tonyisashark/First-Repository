[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bot"
version = "1.2.0"
description = "Autonomous, risk-managed Kalshi trading bot that compounds a portfolio across multiple strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "cryptography>=41",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
kalshi-bot = "kalshi_bot.cli:main"

[project.gui-scripts]
kalshi-bot-gui = "kalshi_bot.gui:main"

[tool.setuptools.packages.find]
include = ["kalshi_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
