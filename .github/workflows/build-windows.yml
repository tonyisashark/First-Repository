name: Build Windows installer

# Builds the standalone GUI executable and the Windows installer on a
# Windows runner, then uploads them as downloadable artifacts. On a version
# tag (v*) the installer is also attached to a GitHub Release.

on:
  push:
    branches: [ "claude/**", main, master ]
    tags: [ "v*" ]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write           # needed only for the release step on tag pushes

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Generate application icon
        run: python assets/make_icon.py

      - name: Build executable (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean kalshi_temp_bot.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\kalshi_temp_bot.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KalshiTempBot-Windows
          path: |
            installer/Output/KalshiTempBotSetup.exe
            dist/KalshiTempBot.exe
          if-no-files-found: error

      - name: Attach installer to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "installer/Output/KalshiTempBotSetup.exe" `
            --title "$env:GITHUB_REF_NAME" --notes "Automated Windows build" `
          || gh release upload "$env:GITHUB_REF_NAME" "installer/Output/KalshiTempBotSetup.exe" --clobber
